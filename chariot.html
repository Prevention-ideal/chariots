<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Documents chariot — idéal prévention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0f1923;--soft:#4a5568;--faint:#8a97a8;--rule:#e2e8f0;--sheet:#f3f5f8;--blue:#026DE1;--green:#0d7c4b;--green-l:#e6f6ee;--red:#c41a1a;--red-l:#fff0f0;--orange:#b55400;--orange-l:#fff4e6}
html,body{background:var(--sheet)}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
header{background:var(--ink);color:#fff;padding:18px 18px 22px;padding-top:max(18px,env(safe-area-inset-top))}
.logo{height:30px;display:block;margin-bottom:18px}
.badge{display:inline-block;background:var(--blue);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:5px}
.num{float:right;font-size:12px;color:var(--faint);font-weight:600;margin-top:3px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.sub{color:#b9c3cf;font-size:14px;margin-top:2px}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.val{font-size:14px;font-weight:600;margin-top:1px;word-break:break-word}
.vgp{border-radius:14px;padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
.vgp .ico{font-size:30px;line-height:1}
.vgp h2{font-size:17px;font-weight:700}
.vgp p{font-size:13.5px;margin-top:3px}
.vgp.ok{background:var(--green-l);color:var(--green);border:1.5px solid #a9dcc2}
.vgp.soon{background:var(--orange-l);color:var(--orange);border:1.5px solid #f5cf9f}
.vgp.exp{background:var(--red);color:#fff}
.vgp.none{background:#fff;color:var(--soft);border:1.5px dashed var(--rule)}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin:20px 2px 8px}
.doc{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;min-height:68px;transition:transform .08s}
.doc:active{transform:scale(.985)}
.doc .di{width:42px;height:42px;border-radius:10px;background:#eaf3fe;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.doc .dt{flex:1}
.doc .dn{font-weight:700;font-size:15px}
.doc .ds{font-size:12.5px;color:var(--faint);margin-top:1px}
.doc .go{color:var(--faint);font-size:20px}
.doc.missing{background:#fafafa;border-style:dashed;pointer-events:none}
.doc.missing .di{background:var(--red-l);color:var(--red)}
.doc.missing .ds{color:var(--red);font-weight:600}
.doc.missing .go{display:none}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:1px}
.st.ok{background:var(--green-l);color:var(--green)}
.st.ko{background:var(--red-l);color:var(--red)}
.check{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--soft)}
.check strong{color:var(--ink)}
.check.alert{border-color:#f3b4b4;background:var(--red-l);color:#8f1212}
footer{text-align:center;color:var(--faint);font-size:11.5px;padding:18px 16px 30px}
.err{padding:40px 20px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div id="app"></div>
<script src="chariots.js"></script>
<script>
const DOCS = [
  { file: 'VGP.pdf', name: 'Rapport de VGP', desc: 'Vérification générale périodique', icon: '🛡️' },
  { file: 'notice.pdf', name: "Notice d'utilisation", desc: 'Manuel du constructeur', icon: '📘' },
  { file: 'certificat_conformite.pdf', name: 'Certificat de conformité', desc: 'Déclaration CE de conformité', icon: '📜' },
  { file: 'carnet_maintenance.pdf', name: 'Carnet de maintenance', desc: 'Entretiens et réparations', icon: '🔧' },
];
const pad = n => String(n).padStart(2, '0');
const fmt = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
function parseFR(t) { const m = (t || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!m) return null; const d = new Date(+m[3], +m[2] - 1, +m[1]); return isNaN(d) ? null : d; }
function addMonths(d, n) { const last = new Date(d.getFullYear(), d.getMonth() + n + 1, 0).getDate(); return new Date(d.getFullYear(), d.getMonth() + n, Math.min(d.getDate(), last)); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const id = (new URLSearchParams(location.search).get('c') || '').padStart(2, '0');
const c = (window.CHARIOTS || []).find(x => x.id === id);
const app = document.getElementById('app');

if (!c) {
  app.innerHTML = '<header><img class="logo" src="logo-blanc.svg" alt="idéal prévention"></header><div class="err"><h2>Chariot introuvable</h2><p style="margin-top:8px">Ce QR code ne correspond à aucun chariot. Prévenez votre formateur.</p></div>';
} else if (c.retire) {
  document.title = 'Chariot ' + c.id + ' — retiré';
  app.innerHTML = `<header><img class="logo" src="logo-blanc.svg" alt="idéal prévention"><span class="badge">${esc(c.categorie)}</span><span class="num">Chariot n° ${esc(c.id)}</span><h1>${esc(c.designation)}</h1><div class="sub">${esc(c.constructeur)} — ${esc(c.modele)}</div></header>
  <main><div class="vgp exp"><div class="ico">⛔</div><div><h2>Engin retiré du parc</h2><p>Cet engin ne doit plus être utilisé. Prévenez votre formateur et retirez l'étiquette.</p></div></div></main>`;
} else {
  document.title = 'Chariot ' + c.id + ' — ' + c.designation;
  const last = parseFR(c.vgp);
  let v;
  if (!last) v = { cls: 'none', ico: '❔', t: 'VGP non renseignée', p: 'Prévenez votre formateur avant toute utilisation.' };
  else {
    const next = addMonths(last, c.vgpMois || 6), t = new Date(); t.setHours(0, 0, 0, 0);
    const left = Math.round((next - t) / 86400000);
    if (left < 0) v = { cls: 'exp', ico: '⛔', t: 'VGP expirée depuis le ' + fmt(next), p: "N'utilisez pas ce chariot. Prévenez immédiatement votre formateur." };
    else if (left <= 30) v = { cls: 'soon', ico: '⚠️', t: 'VGP valide jusqu’au ' + fmt(next), p: 'Expire dans ' + left + ' jour' + (left > 1 ? 's' : '') + ' — dernière VGP le ' + fmt(last) + '.' };
    else v = { cls: 'ok', ico: '✅', t: 'VGP à jour', p: 'Valide jusqu’au ' + fmt(next) + ' — dernière VGP le ' + fmt(last) + '.' };
  }
  app.innerHTML = `
  <header>
    <img class="logo" src="logo-blanc.svg" alt="idéal prévention">
    <span class="badge">${esc(c.categorie)}</span><span class="num">Chariot n° ${esc(c.id)}</span>
    <h1>${esc(c.designation)}</h1>
    <div class="sub">${esc(c.constructeur)} — ${esc(c.modele)}</div>
  </header>
  <main>
    <div class="vgp ${v.cls}"><div class="ico">${v.ico}</div><div><h2>${v.t}</h2><p>${v.p}</p></div></div>
    <div class="card ids">
      <div><div class="lbl">N° de série</div><div class="val">${esc(c.serie || '—')}</div></div>
      <div><div class="lbl">Capacité nominale</div><div class="val">${esc(c.capacite || '—')}</div></div>
    </div>
    <div class="sec">Documents du chariot <span id="count"></span></div>
    <div id="docs">${DOCS.map((d, i) => `
      <a class="doc" id="doc-${i}" href="docs/${c.id}/${d.file}" target="_blank" rel="noopener">
        <div class="di">${d.icon}</div>
        <div class="dt"><div class="dn">${d.name}</div><div class="ds">${d.desc}</div></div>
        <div class="go">›</div>
      </a>`).join('')}
    </div>
    <div class="check" id="check"><strong>Avant d'utiliser le chariot</strong>, vérifiez que les 4 documents sont présents et que la VGP est à jour.</div>
  </main>
  <footer>IDEAL PREVENTION SECURITE · Documents réservés aux stagiaires et formateurs</footer>`;

  // Vérifie la présence de chaque document sur le serveur
  if (location.protocol.startsWith('http')) {
    Promise.all(DOCS.map((d, i) => fetch(`docs/${c.id}/${d.file}`, { method: 'HEAD', cache: 'no-store' })
      .then(r => r.ok && !(r.headers.get('content-type') || '').includes('text/html'))
      .catch(() => true)
      .then(ok => {
        const el = document.getElementById('doc-' + i);
        if (!ok) { el.classList.add('missing'); el.querySelector('.ds').textContent = 'Document manquant'; el.removeAttribute('href'); }
        return ok;
      }))).then(res => {
        const n = res.filter(Boolean).length;
        document.getElementById('count').innerHTML = `<span class="st ${n === DOCS.length ? 'ok' : 'ko'}">${n}/${DOCS.length}</span>`;
        if (n < DOCS.length || v.cls === 'exp' || v.cls === 'none') {
          const ch = document.getElementById('check'); ch.classList.add('alert');
          ch.innerHTML = '<strong>Dossier incomplet ou VGP non valide.</strong> Ne pas utiliser ce chariot avant l’accord de votre formateur.';
        }
      });
  }
}
</script>
</body>
</html>
